# Canonical bookmaker catalog — one flat list, not per-league (unlike
# teams/markets). `altNames` covers casing/spacing variants seen on the
# wire (Oddschecker's own embedded bookmaker-name map, hub's marks[]
# prices[], scraped HTML) that a straight fuzzy/exact match on `name`
# would otherwise miss.
#
# Merged from outrights-sst's config/core-data/bookmakers.json (the
# longest-standing list, 34 entries) plus 4 bookmakers confirmed live on
# Oddschecker's ENG1 "Winner" market (2026-09-10) that appeared in none of
# the existing per-app lists: BetAhoy, BetTom, Ivybet, Parimatch. Dropped
# "Unknown" (sst's placeholder for unattributed prices, not a real
# bookmaker).
#
# Maximal, same discipline as markets.yaml: a live-scrape run that doesn't
# see a bookmaker on a given day is not grounds to remove it here — only
# ever add.
